# 研协自托管 SearXNG 配置（只在 Compose 内网里给 app 用，不对外暴露端口）。
# 继承 SearXNG 默认设置，只覆盖需要的项。密钥由环境变量 SEARXNG_SECRET 覆盖（见 docker-compose.yml）。
use_default_settings: true

general:
  instance_name: 'srh-search'
  enable_metrics: false

server:
  # 由 SEARXNG_SECRET 环境变量覆盖；这里的值只是占位
  secret_key: 'overridden-by-SEARXNG_SECRET'
  limiter: false # 只有 app 在内网调用，不需要按 IP 限流
  public_instance: false
  image_proxy: false
  method: 'GET'

search:
  safe_search: 0
  autocomplete: ''
  default_lang: 'auto'
  # app 调 JSON 接口；html 保留给排查问题时用
  formats:
    - html
    - json
  # 单个引擎太慢就放弃，保证整体响应快
  max_request_timeout: 6.0

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
  pool_connections: 50
  pool_maxsize: 10
  enable_http2: true
  useragent_suffix: ''

ui:
  static_use_hash: true

# 通用搜索引擎组合按一台美国机房服务器的实测结果选择，2026-10-27：
# 能用：bing、brave、yahoo、mwmbl、google cse（默认启用）、bing news、arxiv；综合查询 0.7–0.9 秒、37–88 条
# 上游拦截，已关闭：google（access denied）、google scholar（access denied）、qwant（access denied）、
#   duckduckgo（CAPTCHA / 证书校验失败）、wikipedia（too many requests）、wikidata（超时）
# 没有结果，已关闭：mojeek、startpage
# 学术检索主要走 paper_search（OpenAlex / Semantic Scholar / Crossref / arXiv），这里只保留 arxiv。
# 换了服务器或上游恢复后，可以用 deploy/searxng/probe-engines.sh 重测，再调整这里。
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: yahoo
    disabled: false
  - name: mwmbl
    disabled: false
  - name: bing news
    disabled: false
  - name: arxiv
    disabled: false
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: pypi
    disabled: false
  - name: mojeek
    disabled: true
  - name: startpage
    disabled: true
  - name: google
    disabled: true
  - name: google scholar
    disabled: true
  - name: google news
    disabled: true
  - name: qwant
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: duckduckgo news
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: semantic scholar
    disabled: true
  - name: crossref
    disabled: true
